<!DOCTYPE html>
<html>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<head>
		<title>FLIP Fluid</title>
		<style>
			body {
				font-family: verdana; 
				font-size: 15px;
			}			
			.button {
				background-color: #606060;
				border: none;
				color: white;
				padding: 10px 10px;
				font-size: 16px;
				margin: 4px 2px;
				cursor: pointer;
			}
			.slider {
				-webkit-appearance: none;
				width: 80px;
				height: 6px;
				border-radius: 5px;
				background: #d3d3d3;
				outline: none;
				opacity: 0.7;
				-webkit-transition: .2s;
				transition: opacity .2s;
			}
		</style>
	</head>
	
<body>

	<input type = "checkbox" onclick = "scene.showParticles = !scene.showParticles">Particles &nbsp; 
	<input type = "checkbox" checked onclick = "scene.showGrid = !scene.showGrid">Grid &nbsp;
	<select onchange = "setRenderScale(parseInt(this.value))">
		<option value = "1">1x</option>
		<option value = "2">2x</option>
		<option value = "4" selected>4x</option>
		<option value = "8">8x</option>
	</select> Grid Resolution &nbsp;
	<input type = "range" min = "1" max = "6" step = "1" value = "2" class = "slider" oninput = "setRenderRadius(parseInt(this.value))"> Blur Radius <span id = "radiusValue">2</span> &nbsp;
	<input type = "range" min = "0.05" max = "2" step = "0.05" value = "0.15" class = "slider" oninput = "setRenderThreshold(parseFloat(this.value))"> Surface Threshold <span id = "thresholdValue">0.15</span> &nbsp;
	<input type = "checkbox" checked onclick = "scene.compensateDrift = !scene.compensateDrift">Compensate Drift &nbsp;
	<input type = "checkbox" checked onclick = "scene.separateParticles = !scene.separateParticles">Separate Particles &nbsp;
	PIC
	<input type = "range" min = "0" max = "10" value = "9" class = "slider" onchange="scene.flipRatio = 0.1 * this.value"> FLIP 
<br>
	<canvas id="myCanvas" style="border:2px solid; touch-action:none"></canvas>
	
<script>

	var canvas = document.getElementById("myCanvas");
	var gl = canvas.getContext("webgl");	

	// cells actually usable by the fluid; the tank pads a one-cell wall ring around them
	var gridResX = 128/4;
	var gridResY = 32/4;
	var gridSpacing = 3.0 / gridResY;

	// FlipFluid derives its cell counts as floor(size / h) + 1, so the padded tank spans half a cell less
	var simHeight = (gridResY + 1.5) * gridSpacing;
	var simWidth = (gridResX + 1.5) * gridSpacing;

	// drawn region, filled in by setupScene; excludes the wall cells
	var viewX = 0.0, viewY = 0.0, viewWidth = 1.0, viewHeight = 1.0;

	var FLUID_CELL = 0;
	var AIR_CELL = 1;
	var SOLID_CELL = 2;

	function clamp(x, min, max) 
	{
		if (x < min)
			return min;
		else if (x > max)
			return max;
		else 
			return x;
	}

	var SCATTER_WEIGHT = 256;

	// the divisor in the pressure solve is a face count, so reciprocals come from a table
	var INV_S = [0.0, 1.0, 0.5, 1.0 / 3.0, 0.25];

	// sliding-window sum: 1 add + 1 subtract per cell, so the cost never depends on `r`.
	// Edges replicate, otherwise the shrinking window would thin the water out at the walls.
	function boxBlurLine(src, srcBase, srcStride, dst, dstBase, dstStride, count, r) 
	{
		var last = count - 1;
		if (r > last)
			r = last;

		var sum = src[srcBase] * (r + 1);
		for (var i = 1; i <= r; i++)
			sum += src[srcBase + i * srcStride];

		dst[dstBase] = sum;

		for (var i = 1; i < count; i++) {
			var add = i + r;
			if (add > last) add = last;
			var sub = i - r - 1;
			if (sub < 0) sub = 0;

			sum += src[srcBase + add * srcStride] - src[srcBase + sub * srcStride];
			dst[dstBase + i * dstStride] = sum;
		}
	}

	// ----------------- start of simulator ------------------------------

	class FlipFluid {
		constructor(width, height, spacing, particleRadius, maxParticles) {

			// fluid

			this.fNumX = Math.floor(width / spacing) + 1;
			this.fNumY = Math.floor(height / spacing) + 1;
			this.h = Math.max(width / this.fNumX, height / this.fNumY);
			this.fInvSpacing = 1.0 / this.h;
			this.fNumCells = this.fNumX * this.fNumY;

			this.u = new Float32Array(this.fNumCells);
			this.v = new Float32Array(this.fNumCells);
			this.du = new Float32Array(this.fNumCells);
			this.dv = new Float32Array(this.fNumCells);
			this.prevU = new Float32Array(this.fNumCells);
			this.prevV = new Float32Array(this.fNumCells);
			this.cellType = new Int32Array(this.fNumCells);

			// per-face "has a non-air cell on either side", rebuilt once per frame
			this.uValid = new Float32Array(this.fNumCells);
			this.vValid = new Float32Array(this.fNumCells);

			// compacted list of solvable cells, so the iteration loop is dense and branch-free
			this.pressureCells = new Int32Array(this.fNumCells);
			this.pressureScale = new Float32Array(this.fNumCells);
			this.pressureDrift = new Float32Array(this.fNumCells);
			this.pressureFaces = new Float32Array(4 * this.fNumCells);
			this.numPressureCells = 0;

			// render grid

			this.renderThreshold = 0.15;
			this.renderRadius = 2;
			this.setRenderScale(4);

			// particles

			this.maxParticles = maxParticles;

			this.particlePos = new Float32Array(2 * this.maxParticles);
			this.particleVel = new Float32Array(2 * this.maxParticles);
			this.particleDensity = new Float32Array(this.fNumCells);
			this.particleRestDensity = 0.0;

			this.particleRadius = particleRadius;
			this.pInvSpacing = 1.0 / (2.2 * particleRadius);
			this.pNumX = Math.floor(width * this.pInvSpacing) + 1;
			this.pNumY = Math.floor(height * this.pInvSpacing) + 1;
			this.pNumCells = this.pNumX * this.pNumY;

			this.numCellParticles = new Int32Array(this.pNumCells);
			this.firstCellParticle = new Int32Array(this.pNumCells + 1);
			this.cellParticleIds = new Int32Array(maxParticles);

			this.numParticles = 0;
		}

		integrateParticles(dt, gravityX, gravityY) 
		{
			for (var i = 0; i < this.numParticles; i++) {
				this.particleVel[2 * i] += dt * gravityX;
				this.particleVel[2 * i + 1] += dt * gravityY;
				this.particlePos[2 * i] += this.particleVel[2 * i] * dt;
				this.particlePos[2 * i + 1] += this.particleVel[2 * i + 1] * dt;
			}
		}

		pushParticlesApart(numIters) 
		{
			// count particles per cell

			this.numCellParticles.fill(0);

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
				var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
				var cellNr = xi * this.pNumY + yi;
				this.numCellParticles[cellNr]++;
			}

			// partial sums

			var first = 0;

			for (var i = 0; i < this.pNumCells; i++) {
				first += this.numCellParticles[i];
				this.firstCellParticle[i] = first;
			}
			this.firstCellParticle[this.pNumCells] = first;		// guard

			// fill particles into cells

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
				var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
				var cellNr = xi * this.pNumY + yi;
				this.firstCellParticle[cellNr]--;
				this.cellParticleIds[this.firstCellParticle[cellNr]] = i;
			}

			// push particles apart

			var minDist = 2.0 * this.particleRadius;
			var minDist2 = minDist * minDist;

			for (var iter = 0; iter < numIters; iter++) {

				for (var i = 0; i < this.numParticles; i++) {
					var px = this.particlePos[2 * i];
					var py = this.particlePos[2 * i + 1];

					var pxi = Math.floor(px * this.pInvSpacing);
					var pyi = Math.floor(py * this.pInvSpacing);
					var x0 = Math.max(pxi - 1, 0);
					var y0 = Math.max(pyi - 1, 0);
					var x1 = Math.min(pxi + 1, this.pNumX - 1);
					var y1 = Math.min(pyi + 1, this.pNumY - 1);

					for (var xi = x0; xi <= x1; xi++) {
						for (var yi = y0; yi <= y1; yi++) {
							var cellNr = xi * this.pNumY + yi;
							var first = this.firstCellParticle[cellNr];
							var last = this.firstCellParticle[cellNr + 1];
							for (var j = first; j < last; j++) {
								var id = this.cellParticleIds[j];
								if (id == i)
									continue;
								var qx = this.particlePos[2 * id];
								var qy = this.particlePos[2 * id + 1];

								var dx = qx - px;
								var dy = qy - py;
								var d2 = dx * dx + dy * dy;
								if (d2 > minDist2 || d2 == 0.0) 
									continue;
								var d = Math.sqrt(d2);
								var s = 0.5 * (minDist - d) / d;
								dx *= s;
								dy *= s;
								this.particlePos[2 * i] -= dx;
								this.particlePos[2 * i + 1] -= dy;
								this.particlePos[2 * id] += dx;
								this.particlePos[2 * id + 1] += dy;
							}
						}
					}
				}
			}
		}

		handleParticleCollisions() 
		{
			var h = 1.0 / this.fInvSpacing;
			var r = this.particleRadius;

			var minX = h + r;
			var maxX = (this.fNumX - 1) * h - r;
			var minY = h + r;
			var maxY = (this.fNumY - 1) * h - r;


			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				// wall collisions

				if (x < minX) {
					x = minX;
					this.particleVel[2 * i] = 0.0;

				}
				if (x > maxX) {
					x = maxX;
					this.particleVel[2 * i] = 0.0;
				}
				if (y < minY) {
					y = minY;
					this.particleVel[2 * i + 1] = 0.0;
				}
				if (y > maxY) {
					y = maxY;
					this.particleVel[2 * i + 1] = 0.0;
				}
				this.particlePos[2 * i] = x;
				this.particlePos[2 * i + 1] = y;
			}
		}

		updateParticleDensity()
		{
			var n = this.fNumY;
			var h = this.h;
			var h1 = this.fInvSpacing;
			var h2 = 0.5 * h;

			var d = this.particleDensity;

			d.fill(0.0);

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				x = clamp(x, h, (this.fNumX - 1) * h);
				y = clamp(y, h, (this.fNumY - 1) * h);

				var x0 = Math.floor((x - h2) * h1);
				var tx = ((x - h2) - x0 * h) * h1;
				var x1 = Math.min(x0 + 1, this.fNumX-2);
				
				var y0 = Math.floor((y-h2)*h1);
				var ty = ((y - h2) - y0*h) * h1;
				var y1 = Math.min(y0 + 1, this.fNumY-2);

				var sx = 1.0 - tx;
				var sy = 1.0 - ty;

				if (x0 < this.fNumX && y0 < this.fNumY) d[x0 * n + y0] += sx * sy;
				if (x1 < this.fNumX && y0 < this.fNumY) d[x1 * n + y0] += tx * sy;
				if (x1 < this.fNumX && y1 < this.fNumY) d[x1 * n + y1] += tx * ty;
				if (x0 < this.fNumX && y1 < this.fNumY) d[x0 * n + y1] += sx * ty;
			}

			if (this.particleRestDensity == 0.0) {
				var sum = 0.0;
				var numFluidCells = 0;

				for (var i = 0; i < this.fNumCells; i++) {
					if (this.cellType[i] == FLUID_CELL) {
						sum += d[i];
						numFluidCells++;
					}
				}

				if (numFluidCells > 0)
					this.particleRestDensity = sum / numFluidCells;
			}
		}

		transferVelocities(toGrid, flipRatio)
		{
			var n = this.fNumY;
			var h = this.h;
			var h1 = this.fInvSpacing;
			var h2 = 0.5 * h;

			if (toGrid) {

				this.prevU.set(this.u);
				this.prevV.set(this.v);

				this.du.fill(0.0);
				this.dv.fill(0.0);
				this.u.fill(0.0);
				this.v.fill(0.0);

				// the outer ring of cells is the tank itself; the top stays open
				for (var i = 0; i < this.fNumX; i++) {
					for (var j = 0; j < this.fNumY; j++) {
						var wall = i == 0 || i == this.fNumX - 1 || j == 0;
						this.cellType[i * n + j] = wall ? SOLID_CELL : AIR_CELL;
					}
				}

				for (var i = 0; i < this.numParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];
					var xi = clamp(Math.floor(x * h1), 0, this.fNumX - 1);
					var yi = clamp(Math.floor(y * h1), 0, this.fNumY - 1);
					var cellNr = xi * n + yi;
					if (this.cellType[cellNr] == AIR_CELL)
						this.cellType[cellNr] = FLUID_CELL;
				}

				for (var i = 0; i < this.fNumX; i++) {
					for (var j = 0; j < this.fNumY; j++) {
						var c = i * n + j;
						var notAir = this.cellType[c] != AIR_CELL;
						this.uValid[c] = notAir || (i > 0 && this.cellType[c - n] != AIR_CELL) ? 1.0 : 0.0;
						this.vValid[c] = notAir || (j > 0 && this.cellType[c - 1] != AIR_CELL) ? 1.0 : 0.0;
					}
				}
			}

			for (var component = 0; component < 2; component++) {

				var dx = component == 0 ? 0.0 : h2;
				var dy = component == 0 ? h2 : 0.0;
	
				var f = component == 0 ? this.u : this.v;
				var prevF = component == 0 ? this.prevU : this.prevV;
				var d = component == 0 ? this.du : this.dv;
				var valid = component == 0 ? this.uValid : this.vValid;

				for (var i = 0; i < this.numParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					x = clamp(x, h, (this.fNumX - 1) * h);
					y = clamp(y, h, (this.fNumY - 1) * h);

					var x0 = Math.min(Math.floor((x - dx) * h1), this.fNumX - 2);
					var tx = ((x - dx) - x0 * h) * h1;
					var x1 = Math.min(x0 + 1, this.fNumX-2);
					
					var y0 = Math.min(Math.floor((y-dy)*h1), this.fNumY-2);
					var ty = ((y - dy) - y0*h) * h1;
					var y1 = Math.min(y0 + 1, this.fNumY-2);

					var sx = 1.0 - tx;
					var sy = 1.0 - ty;

					var d0 = sx*sy;
					var d1 = tx*sy;
					var d2 = tx*ty;
					var d3 = sx*ty;

					var nr0 = x0*n + y0;
					var nr1 = x1*n + y0;
					var nr2 = x1*n + y1;
					var nr3 = x0*n + y1;

					if (toGrid) {
						var pv = this.particleVel[2 * i + component];
						f[nr0] += pv * d0;  d[nr0] += d0;
						f[nr1] += pv * d1;  d[nr1] += d1;
						f[nr2] += pv * d2;  d[nr2] += d2;
						f[nr3] += pv * d3;  d[nr3] += d3;
					}
					else {
						var valid0 = valid[nr0];
						var valid1 = valid[nr1];
						var valid2 = valid[nr2];
						var valid3 = valid[nr3];

						var v = this.particleVel[2 * i + component];
						var d = valid0 * d0 + valid1 * d1 + valid2 * d2 + valid3 * d3;

						if (d > 0.0) {

							var picV = (valid0 * d0 * f[nr0] + valid1 * d1 * f[nr1] + valid2 * d2 * f[nr2] + valid3 * d3 * f[nr3]) / d;
							var corr = (valid0 * d0 * (f[nr0] - prevF[nr0]) + valid1 * d1 * (f[nr1] - prevF[nr1])
								+ valid2 * d2 * (f[nr2] - prevF[nr2]) + valid3 * d3 * (f[nr3] - prevF[nr3])) / d;
							var flipV = v + corr;

							this.particleVel[2 * i + component] = (1.0 - flipRatio) * picV + flipRatio * flipV;
						}
					}
				}

				if (toGrid) {
					for (var i = 0; i < f.length; i++) {
						if (d[i] > 0.0)
							f[i] /= d[i];
					}

					// restore solid cells

					for (var i = 0; i < this.fNumX; i++) {
						for (var j = 0; j < this.fNumY; j++) {
							var solid = this.cellType[i * n + j] == SOLID_CELL;
							if (solid || (i > 0 && this.cellType[(i - 1) * n + j] == SOLID_CELL))
								this.u[i * n + j] = this.prevU[i * n + j];
							if (solid || (j > 0 && this.cellType[i * n + j - 1] == SOLID_CELL))
								this.v[i * n + j] = this.prevV[i * n + j];
						}
					}
				}
			}
		}

		// cell types, face weights and the drift term are all constant across the iterations,
		// so gather them once into dense arrays
		buildPressureCells(overRelaxation, compensateDrift) 
		{
			var n = this.fNumY;
			var cells = this.pressureCells;
			var scale = this.pressureScale;
			var drift = this.pressureDrift;
			var faces = this.pressureFaces;

			var driftOn = compensateDrift && this.particleRestDensity > 0.0;
			var count = 0;

			for (var i = 1; i < this.fNumX - 1; i++) {
				for (var j = 1; j < this.fNumY - 1; j++) {

					var center = i * n + j;
					if (this.cellType[center] != FLUID_CELL)
						continue;

					var sx0 = this.cellType[center - n] == SOLID_CELL ? 0.0 : 1.0;
					var sx1 = this.cellType[center + n] == SOLID_CELL ? 0.0 : 1.0;
					var sy0 = this.cellType[center - 1] == SOLID_CELL ? 0.0 : 1.0;
					var sy1 = this.cellType[center + 1] == SOLID_CELL ? 0.0 : 1.0;
					var s = sx0 + sx1 + sy0 + sy1;
					if (s == 0.0)
						continue;

					var b = 4 * count;
					faces[b] = sx0;
					faces[b + 1] = sx1;
					faces[b + 2] = sy0;
					faces[b + 3] = sy1;

					cells[count] = center;
					scale[count] = overRelaxation * INV_S[s];

					var compression = 0.0;
					if (driftOn) {
						compression = this.particleDensity[center] - this.particleRestDensity;
						if (compression < 0.0)
							compression = 0.0;
					}
					drift[count] = compression;

					count++;
				}
			}

			this.numPressureCells = count;
		}

		solveIncompressibility(numIters, overRelaxation, compensateDrift = true) {

			this.prevU.set(this.u);
			this.prevV.set(this.v);

			this.buildPressureCells(overRelaxation, compensateDrift);

			var n = this.fNumY;
			var count = this.numPressureCells;
			var cells = this.pressureCells;
			var scale = this.pressureScale;
			var drift = this.pressureDrift;
			var faces = this.pressureFaces;
			var u = this.u;
			var v = this.v;

			for (var iter = 0; iter < numIters; iter++) {

				for (var k = 0; k < count; k++) {

					var center = cells[k];
					var right = center + n;
					var top = center + 1;

					var div = u[right] - u[center] + v[top] - v[center] - drift[k];
					var p = -div * scale[k];

					var b = 4 * k;
					u[center] -= faces[b] * p;
					u[right] += faces[b + 1] * p;
					v[center] -= faces[b + 2] * p;
					v[top] += faces[b + 3] * p;
				}
			}
		}

		// the render grid subdivides each simulation cell `scale` times per axis and is
		// never read back by the solver
		setRenderScale(scale) 
		{
			this.renderScale = scale;
			this.rNumX = this.fNumX * scale;
			this.rNumY = this.fNumY * scale;
			this.rNumCells = this.rNumX * this.rNumY;
			this.rh = this.h / scale;
			this.renderAcc = new Int32Array(this.rNumCells);
			this.renderLine = new Int32Array(Math.max(this.rNumX, this.rNumY));
			this.renderFill = new Float32Array(this.rNumCells);
		}

		// scatter one weight per particle, then smear with separable box blurs; cost is
		// O(particles + cells) and independent of the blur radius
		updateRenderGrid() 
		{
			var W = this.rNumX;
			var H = this.rNumY;
			var acc = this.renderAcc;
			var line = this.renderLine;

			acc.fill(0);

			// the wall ring is outside the drawn region, so never sample or blur it
			var loX = this.renderScale;
			var hiX = W - this.renderScale - 1;
			var loY = this.renderScale;
			var hiY = H - this.renderScale - 1;

			var rInv = 1.0 / this.rh;

			var minX = hiX, maxX = loX, minY = hiY, maxY = loY;

			for (var i = 0; i < this.numParticles; i++) {
				var cx = this.particlePos[2 * i] * rInv | 0;
				var cy = this.particlePos[2 * i + 1] * rInv | 0;

				if (cx < loX) cx = loX; else if (cx > hiX) cx = hiX;
				if (cy < loY) cy = loY; else if (cy > hiY) cy = hiY;

				if (cx < minX) minX = cx;
				if (cx > maxX) maxX = cx;
				if (cy < minY) minY = cy;
				if (cy > maxY) maxY = cy;

				acc[cx * H + cy] += SCATTER_WEIGHT;
			}

			var g = this.renderFill;

			if (maxX < minX) {
				g.fill(0.0);
				return;
			}

			var pr = this.particleRadius;
			var radius = this.renderRadius;

			// two box passes reach 2r, so grow the dirty box by that much before blurring
			var reach = 2 * radius;
			minX -= reach; if (minX < loX) minX = loX;
			maxX += reach; if (maxX > hiX) maxX = hiX;
			minY -= reach; if (minY < loY) minY = loY;
			maxY += reach; if (maxY > hiY) maxY = hiY;

			var spanX = maxX - minX + 1;
			var spanY = maxY - minY + 1;

			// two passes per axis give a tent kernel, which merges blobs far more evenly than a box
			for (var cx = minX; cx <= maxX; cx++) {
				var base = cx * H + minY;
				boxBlurLine(acc, base, 1, line, 0, 1, spanY, radius);
				boxBlurLine(line, 0, 1, acc, base, 1, spanY, radius);
			}
			for (var cy = minY; cy <= maxY; cy++) {
				var base = minX * H + cy;
				boxBlurLine(acc, base, H, line, 0, 1, spanX, radius);
				boxBlurLine(line, 0, 1, acc, base, H, spanX, radius);
			}

			// particles per cell at full packing, so the threshold means the same at every resolution
			var refCount = (this.rh * this.rh) / (2.0 * Math.sqrt(3.0) * pr * pr);
			var window = 2 * radius + 1;
			var gain = window * window * window * window;
			var t = Math.max(1, Math.round(this.renderThreshold * refCount * SCATTER_WEIGHT * gain));

			for (var i = 0; i < this.rNumCells; i++)
				g[i] = acc[i] >= t ? 1.0 : 0.0;
		}

		simulate(dt, gravityX, gravityY, flipRatio, numPressureIters, numParticleIters, overRelaxation, compensateDrift, separateParticles) 
		{
			this.integrateParticles(dt, gravityX, gravityY);
			if (separateParticles)
				this.pushParticlesApart(numParticleIters); 
			this.handleParticleCollisions()
			this.transferVelocities(true);
			this.updateParticleDensity();
			this.solveIncompressibility(numPressureIters, overRelaxation, compensateDrift);
			this.transferVelocities(false, flipRatio);

			this.updateRenderGrid();
		}
	}

	// ----------------- end of simulator ------------------------------

	var scene = 
	{
		gravityX : 0.0,
		gravityY : -9.81,
		dt : 1.0 / 30.0,
		flipRatio : 0.9,
		numPressureIters : 15,
		numParticleIters : 1,
		overRelaxation : 1.9,
		compensateDrift : true,
		separateParticles : true,
		paused: false,
		showParticles: false,
		showGrid: true,
		fluid: null
	};

	function setupScene() 
	{
		var tankHeight = simHeight;
		var tankWidth = simWidth;
		var h = gridSpacing;

		var relWaterHeight = 0.8
		var relWaterWidth = 0.6

		// compute number of particles

		var r = 0.3 * h;	// particle radius w.r.t. cell size
		var dx = 2.0 * r;
		var dy = Math.sqrt(3.0) / 2.0 * dx;

 		var numX = Math.floor((relWaterWidth * tankWidth - 2.0 * h - 2.0 * r) / dx);
		var numY = Math.floor((relWaterHeight * tankHeight - 2.0 * h - 2.0 * r) / dy);
		var maxParticles = numX * numY;		

		// create fluid

		var f = scene.fluid = new FlipFluid(tankWidth, tankHeight, h, r, maxParticles);

		// create particles

		f.numParticles = numX * numY;
		var p = 0;
		for (var i = 0; i < numX; i++) {
			for (var j = 0; j < numY; j++) {
				f.particlePos[p++] = h + r + dx * i + (j % 2 == 0 ? 0.0 : r);
				f.particlePos[p++] = h + r + dy * j
			}
		}

		// the outer ring of cells is unreachable by particles (walls at left/right/bottom, clamp at top)
		viewX = f.h;
		viewY = f.h;
		viewWidth = (f.fNumX - 2) * f.h;
		viewHeight = (f.fNumY - 2) * f.h;

		var cScale = Math.min((window.innerWidth - 20) / viewWidth, (window.innerHeight - 20) / viewHeight);
		canvas.width = viewWidth * cScale;
		canvas.height = viewHeight * cScale;
	}


	// draw -------------------------------------------------------

	const pointVertexShader = `
		attribute vec2 attrPosition;
		attribute float attrFill;
		uniform vec2 domainOrigin;
		uniform vec2 domainSize;
		uniform float pointSize;
		uniform float drawDisk;

		varying float fragFill;
		varying float fragDrawDisk;

		void main() {
		gl_Position =
			vec4((attrPosition - domainOrigin) / domainSize * 2.0 - 1.0, 0.0, 1.0);

		gl_PointSize = pointSize;
		fragFill = attrFill;
		fragDrawDisk = drawDisk;
		}
	`;

	const pointFragmentShader = `
		precision mediump float;
		uniform vec3 drawColor;
		varying float fragFill;
		varying float fragDrawDisk;

		void main() {
			if (fragFill < 0.5)
				discard;
			if (fragDrawDisk == 1.0) {
				float rx = 0.5 - gl_PointCoord.x;
				float ry = 0.5 - gl_PointCoord.y;
				float r2 = rx * rx + ry * ry;
				if (r2 > 0.25)
					discard;
			}
			gl_FragColor = vec4(drawColor, 1.0);
		}
	`;

	function createShader(gl, vsSource, fsSource) 
	{
		const vsShader = gl.createShader(gl.VERTEX_SHADER);
		gl.shaderSource(vsShader, vsSource);
		gl.compileShader(vsShader);
		if (!gl.getShaderParameter(vsShader, gl.COMPILE_STATUS))
			console.log("vertex shader compile error: " + gl.getShaderInfoLog(vsShader));

		const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
		gl.shaderSource(fsShader, fsSource);
		gl.compileShader(fsShader);
		if (!gl.getShaderParameter(fsShader, gl.COMPILE_STATUS))
			console.log("fragment shader compile error: " + gl.getShaderInfoLog(fsShader));

		var shader = gl.createProgram();
		gl.attachShader(shader, vsShader);
		gl.attachShader(shader, fsShader);
		gl.linkProgram(shader);

		return shader;
	}

	var pointShader = null;

	var pointVertexBuffer = null;

	var gridVertBuffer = null;
	var gridFillBuffer = null;

	function draw() 
	{
		gl.clearColor(0.0, 0.0, 0.0, 1.0);
		gl.clear(gl.COLOR_BUFFER_BIT);

		gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

		// prepare shaders

		if (pointShader == null)
			pointShader = createShader(gl, pointVertexShader, pointFragmentShader);

		// grid

		if (gridVertBuffer == null) {

			var f = scene.fluid;
			gridVertBuffer = gl.createBuffer();
			var cellCenters = new Float32Array(2 * f.rNumCells);
			var p = 0;

			for (var i = 0; i < f.rNumX; i++) {
				for (var j = 0; j < f.rNumY; j++) {
					cellCenters[p++] = (i + 0.5) * f.rh;
					cellCenters[p++] = (j + 0.5) * f.rh;
				}
			}
			gl.bindBuffer(gl.ARRAY_BUFFER, gridVertBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, cellCenters, gl.DYNAMIC_DRAW);
			gl.bindBuffer(gl.ARRAY_BUFFER, null);
		}	

		if (gridFillBuffer == null)
			gridFillBuffer = gl.createBuffer();

		if (scene.showGrid) {

			var pointSize = Math.max(1.0, scene.fluid.rh / viewWidth * canvas.width);

			gl.useProgram(pointShader);
			gl.uniform2f(gl.getUniformLocation(pointShader, 'domainOrigin'), viewX, viewY);
			gl.uniform2f(gl.getUniformLocation(pointShader, 'domainSize'), viewWidth, viewHeight);
			gl.uniform1f(gl.getUniformLocation(pointShader, 'pointSize'), pointSize);
			gl.uniform1f(gl.getUniformLocation(pointShader, 'drawDisk'), 0.0);
			gl.uniform3f(gl.getUniformLocation(pointShader, 'drawColor'), 1.0, 1.0, 1.0);

			gl.bindBuffer(gl.ARRAY_BUFFER, gridVertBuffer);
			var posLoc = gl.getAttribLocation(pointShader, 'attrPosition');
			gl.enableVertexAttribArray(posLoc);
			gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

			gl.bindBuffer(gl.ARRAY_BUFFER, gridFillBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.renderFill, gl.DYNAMIC_DRAW);

			var fillLoc = gl.getAttribLocation(pointShader, 'attrFill');
			gl.enableVertexAttribArray(fillLoc);
			gl.vertexAttribPointer(fillLoc, 1, gl.FLOAT, false, 0, 0);

			gl.drawArrays(gl.POINTS, 0, scene.fluid.rNumCells); 

			gl.disableVertexAttribArray(posLoc);
			gl.disableVertexAttribArray(fillLoc);

			gl.bindBuffer(gl.ARRAY_BUFFER, null);
		}

		// water

		if (scene.showParticles) {
			var pointSize = 2.0 * scene.fluid.particleRadius / viewWidth * canvas.width;

			gl.useProgram(pointShader);
			gl.uniform2f(gl.getUniformLocation(pointShader, 'domainOrigin'), viewX, viewY);
			gl.uniform2f(gl.getUniformLocation(pointShader, 'domainSize'), viewWidth, viewHeight);
			gl.uniform1f(gl.getUniformLocation(pointShader, 'pointSize'), pointSize);
			gl.uniform1f(gl.getUniformLocation(pointShader, 'drawDisk'), 1.0);
			gl.uniform3f(gl.getUniformLocation(pointShader, 'drawColor'), 0.0, 0.0, 1.0);

			if (pointVertexBuffer == null)
				pointVertexBuffer = gl.createBuffer();

			gl.bindBuffer(gl.ARRAY_BUFFER, pointVertexBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.particlePos, gl.DYNAMIC_DRAW);

			var posLoc = gl.getAttribLocation(pointShader, 'attrPosition');
			gl.enableVertexAttribArray(posLoc);
			gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

			// every particle is water, so feed the attribute a constant instead of a buffer
			var fillLoc = gl.getAttribLocation(pointShader, 'attrFill');
			gl.disableVertexAttribArray(fillLoc);
			gl.vertexAttrib1f(fillLoc, 1.0);

			gl.drawArrays(gl.POINTS, 0, scene.fluid.numParticles); 

			gl.disableVertexAttribArray(posLoc);

			gl.bindBuffer(gl.ARRAY_BUFFER, null);
		}
	}

	// interaction -------------------------------------------------------

	function setRenderScale(scale) 
	{
		scene.fluid.setRenderScale(scale);
		scene.fluid.updateRenderGrid();
		gridVertBuffer = null;		// cell centers have to be rebuilt
	}

	function setRenderThreshold(threshold) 
	{
		scene.fluid.renderThreshold = threshold;
		scene.fluid.updateRenderGrid();
		document.getElementById('thresholdValue').textContent = threshold.toFixed(2);
	}

	function setRenderRadius(radius) 
	{
		scene.fluid.renderRadius = radius;
		scene.fluid.updateRenderGrid();
		document.getElementById('radiusValue').textContent = radius;
	}

	var gravityMagnitude = 9.81;
	var draggingGravity = false;

	// gravity points from the canvas centre toward the cursor, so dragging tilts the tank
	function aimGravity(clientX, clientY) 
	{
		var rect = canvas.getBoundingClientRect();
		var dx = clientX - (rect.left + 0.5 * rect.width);
		var dy = (rect.top + 0.5 * rect.height) - clientY;
		var len = Math.sqrt(dx * dx + dy * dy);
		if (len < 1.0)
			return;

		scene.gravityX = gravityMagnitude * dx / len;
		scene.gravityY = gravityMagnitude * dy / len;
	}

	canvas.addEventListener('pointerdown', event => {
		draggingGravity = true;
		canvas.setPointerCapture(event.pointerId);
		aimGravity(event.clientX, event.clientY);
	});

	canvas.addEventListener('pointermove', event => {
		if (draggingGravity)
			aimGravity(event.clientX, event.clientY);
	});

	canvas.addEventListener('pointerup', event => {
		draggingGravity = false;
		canvas.releasePointerCapture(event.pointerId);
	});

	document.addEventListener('keydown', event => {
		switch(event.key) {
			case 'p': scene.paused = !scene.paused; break;
			case 'm': scene.paused = false; simulate(); scene.paused = true; break;
		}
	});

	// main -------------------------------------------------------

	function simulate() 
	{
		if (!scene.paused)
			scene.fluid.simulate(
				scene.dt, scene.gravityX, scene.gravityY, scene.flipRatio, scene.numPressureIters, scene.numParticleIters, 
				scene.overRelaxation, scene.compensateDrift, scene.separateParticles);
	}

	function update() {
		simulate();
		draw();
		requestAnimationFrame(update);
	}
	
	setupScene();
	update();
	
</script> 
</body>
